name: Feature Request
description: Suggest a new feature
labels: ["enhancement"]
body:
  - type: checkboxes
    attributes:
      label: "Pre-submit Checks"
      options:
        - label: "I have searched existing issues and this is not a duplicate"
          required: true
  - type: textarea
    id: "describe-solution"
    attributes:
      label: "Describe the solution you'd like"
    validations:
      required: true
  - type: textarea
    id: "related-to-problem"
    attributes:
      label: "Is this related to a problem?"
    validations:
      required: false
  - type: dropdown
    id: "os"
    attributes:
      label: "Operating system"
      options:
        - macOS
        - Linux
        - Cross-platform
    validations:
      required: true
